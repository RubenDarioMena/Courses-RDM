name: CAD en navegadores Windows

on:
  push:
    branches: [main]
    paths: ['cad/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'vite*.mjs', 'playwright.cad.config.mjs', '.github/workflows/cad-windows.yml']
  pull_request:
    paths: ['cad/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'vite*.mjs', 'playwright.cad.config.mjs', '.github/workflows/cad-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cad-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    name: Windows · ${{ matrix.browser }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      CAD_TEST_PROJECT: ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, msedge, firefox]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar modelo y núcleo WASM
        run: npm test
      - name: Compilar el sitio completo
        run: npm run build
      - name: Instalar Firefox de Playwright
        if: matrix.browser == 'firefox'
        run: npx playwright install firefox
      # Chrome y Microsoft Edge vienen instalados en el runner Windows.
      # Se ejecutan consecutivamente, con un worker, sin requerir una cuenta.
      - name: Probar ${{ matrix.browser }} en Windows
        run: npm run test:cad:browser -- --project=${{ matrix.browser }}
      - name: Conservar informes, descargas y evidencias de fallos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cad-windows-${{ matrix.browser }}
          path: artifacts/cad-browser/
          if-no-files-found: ignore
          retention-days: 14
